name: Bygg webbdata från befintlig historik

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/rebuild_website.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: stock-data-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Bygg och kontrollera webbdata
        run: |
          python -m src.pipeline --skip-fetch --skip-dividends
          python -m src.limit_dashboard_window
          python -m src.validate_outputs
          python -m src.history_guard --base-ref HEAD
      - name: Publicera kontrollerad webbdata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data data/fundamentals/reports.csv data/fundamentals/eps_fx_conversions.csv
          git add data/derived/valuation_score_history.csv.gz data/derived/report_score_dates.csv data/derived/report_date_score_revisions.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: bygg om webbdata från befintlig historik'
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          python -m src.history_guard --base-ref "origin/$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
