name: Yahoo diluted EPS gapfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/backfill_quarterly_eps_statement.py"
      - "src/backfill_quarterly_eps_components.py"
      - "src/derive_missing_quarterly_eps.py"
      - "src/audit_quarterly_eps_readiness.py"
      - ".github/workflows/quarterly_eps_gapfill.yml"

permissions:
  contents: write

concurrency:
  group: stock-data-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  gapfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Bevara befintlig Yahoo EPS-historik i observationsarkivet
        run: python -m src.yahoo_observations

      - name: Fyll diluted EPS-luckor från Yahoo resultaträkningar
        run: python -m src.backfill_quarterly_eps_statement

      - name: Fyll diluted EPS-luckor från Yahoo timeseries-komponenter
        run: python -m src.backfill_quarterly_eps_components

      - name: Härled återstående diluted EPS från Yahoo trailing EPS
        run: python -m src.derive_missing_quarterly_eps

      - name: Kräv fyra sammanhängande diluted EPS-perioder
        run: python -m src.audit_quarterly_eps_readiness

      - name: Spara gapfill och readiness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/earnings/yahoo_observations ]; then git add data/earnings/yahoo_observations; fi
          git add data/earnings/quarterly_eps.csv
          git add docs/data/quarterly_eps.json
          git add data/derived/quarterly_eps_derived_summary.json
          git add data/derived/quarterly_eps_readiness.csv
          git add data/derived/quarterly_eps_readiness_summary.json
          if git diff --cached --quiet; then
            echo "Inga ändringar att spara."
            exit 0
          fi
          git commit -m "data: fill Yahoo diluted EPS gaps"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Spara Yahoo-observationer även om ett senare steg misslyckas
        if: always()
        run: |
          if [ ! -d data/earnings/yahoo_observations ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings/yahoo_observations
          if git diff --cached --quiet -- data/earnings/yahoo_observations; then exit 0; fi
          git commit --only -m "data: bevara hämtade Yahoo EPS-observationer" -- data/earnings/yahoo_observations
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
