name: Yahoo diluted EPS gapfill

on:
  workflow_dispatch:
  push:
    paths:
      - "src/backfill_quarterly_eps_statement.py"
      - "src/audit_quarterly_eps_readiness.py"
      - ".github/workflows/quarterly_eps_gapfill.yml"

permissions:
  contents: write

concurrency:
  group: yahoo-diluted-eps-gapfill
  cancel-in-progress: false

jobs:
  gapfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fyll diluted EPS-luckor från Yahoo resultaträkningar
        run: python -m src.backfill_quarterly_eps_statement

      - name: Kräv fyra sammanhängande diluted EPS-perioder
        run: python -m src.audit_quarterly_eps_readiness

      - name: Spara gapfill och readiness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings/quarterly_eps.csv
          git add docs/data/quarterly_eps.json
          git add data/derived/quarterly_eps_readiness.csv
          git add data/derived/quarterly_eps_readiness_summary.json
          if git diff --cached --quiet; then
            echo "Inga ändringar att spara."
            exit 0
          fi
          git commit -m "data: fill Yahoo diluted EPS gaps"
          git pull --rebase --autostash origin main
          git push origin main
