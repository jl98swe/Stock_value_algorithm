name: Uppdatera valutakurser

on:
  workflow_dispatch:
  push:
    paths:
      - "src/fx.py"
      - "data/metadata/stocks_yahoo.csv"
      - ".github/workflows/fx_update.yml"

permissions:
  contents: write

concurrency:
  group: fx-data-write
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Hämta valutahistorik
        run: python -m src.fx

      - name: Kontrollera valutapar
        run: |
          python - <<'PY'
          from src.fx import load_fx_history, load_stock_currencies, required_currency_pairs
          fx = load_fx_history()
          pairs = required_currency_pairs(load_stock_currencies())
          present = set(zip(fx['base_currency'], fx['quote_currency'])) if not fx.empty else set()
          missing = [pair for pair in pairs if pair not in present]
          if missing:
              raise SystemExit(f"Saknar FX-historik för: {missing}")
          print(f"FX OK: {len(fx)} rader, valutapar {pairs}")
          PY

      - name: Spara valutadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx/fx_initial.csv
          if [ -f data/fx/fx_updates.csv ]; then
            git add data/fx/fx_updates.csv
          fi
          if git diff --cached --quiet; then
            echo "Inga FX-ändringar att spara."
            exit 0
          fi
          git commit -m "data: update FX history"
          git pull --rebase origin main
          git push origin main
