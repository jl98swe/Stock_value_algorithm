name: Frigör kö för historikrättelse

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/history_recovery_queue.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Stoppa automatiska extrakörningar från LUMI-rättelsen
        uses: actions/github-script@v7
        with:
          script: |
            // Exact push runs triggered by this LUMI correction only.
            // Retain the dedicated correction and latest CI; never touch scheduled/manual runs.
            const duplicates = [
              {
                "id": 42092632631,
                "head": "a4a5f7366b906868c8724cedafbc5756d51f4a09",
                "event": "push"
              },
              {
                "id": 42092633369,
                "head": "a4a5f7366b906868c8724cedafbc5756d51f4a09",
                "event": "push"
              },
              {
                "id": 42092633199,
                "head": "a4a5f7366b906868c8724cedafbc5756d51f4a09",
                "event": "push"
              },
              {
                "id": 42093027245,
                "head": "8c5051d281f9b5e7f5413c4c2e6ade3044ab488e",
                "event": "push"
              },
              {
                "id": 42092633393,
                "head": "a4a5f7366b906868c8724cedafbc5756d51f4a09",
                "event": "push"
              },
              {
                "id": 42093027767,
                "head": "8c5051d281f9b5e7f5413c4c2e6ade3044ab488e",
                "event": "push"
              }
            ];
            for (const duplicate of duplicates) {
              const run_id = duplicate.id;
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
              if (run.status === 'completed') continue;
              if (run.head_sha !== duplicate.head || run.event !== duplicate.event || run.head_branch !== 'main') {
                core.warning('Unexpected run identity, leaving untouched: ' + run_id);
                continue;
              }
              await github.rest.actions.cancelWorkflowRun({...context.repo, run_id});
              core.info('Stopped duplicate rebuild ' + run_id);
            }
