name: Dagskurser 17.30 · Avanza

on:
  schedule:
    - cron: "30 17 * * 1-5"
      timezone: "Europe/Stockholm"
    - cron: "0 14 * * 1-5"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  daily:
    uses: ./.github/workflows/daily_update.yml
    with:
      source: Avanza
      planned: ${{ github.event.schedule == '0 14 * * 1-5' && '14:00' || '17:30' }}
