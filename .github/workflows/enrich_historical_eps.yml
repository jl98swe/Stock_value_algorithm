name: Komplettera historisk EPS

on:
  workflow_dispatch:
  push:
    paths:
      - "data/fundamentals/eps_ttm_history.csv"
      - "data/fundamentals/report_date_overrides.csv"
      - "data/metadata/stocks.csv"
      - "config/ticker_mapping.csv"
      - "src/enrich_historical_eps.py"
      - "src/apply_report_date_overrides.py"
      - "src/earnings.py"
      - "src/audit_yahoo_trailing_timeseries.py"
      - "src/build_yahoo_history_all.py"
      - "src/align_historical_eps_to_yahoo.py"
      - "src/apply_strict_reference_gap_fill.py"
      - "src/import_enriched_eps.py"
      - "src/import_strict_reference_gap_fill.py"
      - "src/import_yahoo_history_all.py"
      - "src/audit_eps_gaps.py"
      - "src/sync_yahoo_eps_reports.py"
      - "src/audit_historical_valuation.py"
      - "src/compare_latest_eps.py"
      - "src/limit_dashboard_window.py"
      - ".github/workflows/enrich_historical_eps.yml"

permissions:
  contents: write

concurrency:
  group: enrich-historical-eps
  cancel-in-progress: true

jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Mappa första historikbatchen och rapportdatum
        run: python -m src.enrich_historical_eps

      - name: Applicera verifierade rapportdatum
        run: python -m src.apply_report_date_overrides

      - name: Hämta aktuell Yahoo trailingDilutedEPS
        run: python -m src.earnings

      - name: Testa historisk Yahoo trailingDilutedEPS tillbaka till 2016
        run: python -m src.audit_yahoo_trailing_timeseries

      - name: Bygg direkt Yahoo-historik endast med separata rapportdatum
        run: python -m src.build_yahoo_history_all

      - name: Uppdatera valutakurser för hela universumet
        run: python -m src.fx

      - name: Aligna första batchen till samma Yahoo EPS-definition
        run: python -m src.align_historical_eps_to_yahoo

      - name: Applicera strikt under 1 procent-regel för referenshistorik
        run: python -m src.apply_strict_reference_gap_fill

      - name: Importera Yahoo-alignad första batch till kanoniska rapporter
        run: python -m src.import_enriched_eps

      - name: Importera endast strikt kompatibla referensluckor
        run: python -m src.import_strict_reference_gap_fill

      - name: Importera direkt Yahoo-historik med säkert rapportdatum
        run: python -m src.import_yahoo_history_all

      - name: Synka nya Yahoo-perioder till kanoniska rapporter
        run: python -m src.sync_yahoo_eps_reports

      - name: Klassificera kvarvarande historiska EPS-luckor
        run: python -m src.audit_eps_gaps

      - name: Bygg dashboard med jämförbar historisk och framtida EPS
        run: python -m src.pipeline --skip-fetch --skip-dividends

      - name: Begränsa dashboard från 2024-01-01
        run: python -m src.limit_dashboard_window

      - name: Återställ nyhetsfilen orörd
        run: git restore docs/data/events.json

      - name: Jämför Yahoo EPS med senaste historiska EPS
        run: python -m src.compare_latest_eps

      - name: Auditera historisk P E score och signaler för hela universumet
        run: python -m src.audit_historical_valuation

      - name: Validera data och webbexport
        run: python -m src.validate_outputs

      - name: Visa täckning strikt kompatibilitet och äldre Yahoo-historik
        run: |
          python - <<'PY'
          import pandas as pd

          valuation = pd.read_csv('data/derived/historical_valuation_audit.csv')
          all_history = pd.read_csv('data/derived/yahoo_history_all_audit.csv')
          yahoo_history = pd.read_csv('data/fundamentals/yahoo_history_all.csv')
          reference_gaps = pd.read_csv('data/derived/eps_reference_gap_audit.csv')
          compatibility = pd.read_csv('data/derived/eps_reference_compatibility_audit.csv')
          continuity = pd.read_csv('data/derived/yahoo_history_continuity_audit.csv')
          comparison = pd.read_csv('data/derived/latest_eps_yahoo_comparison.csv')

          internal_reference = reference_gaps.loc[reference_gaps.gap_position == 'internal'] if not reference_gaps.empty else reference_gaps
          internal_period = continuity.loc[continuity.gap_type == 'internal_missing_yahoo_period'] if not continuity.empty else continuity
          internal_date = continuity.loc[continuity.gap_type == 'internal_missing_report_date'] if not continuity.empty else continuity

          yahoo_history['period_end'] = pd.to_datetime(yahoo_history['period_end'], errors='coerce')
          yahoo_history['report_date'] = pd.to_datetime(yahoo_history['report_date'], errors='coerce')
          older = yahoo_history.loc[yahoo_history.period_end.dt.year <= 2021]
          older_dated = older.loc[older.report_date.notna()]
          y2016 = yahoo_history.loc[yahoo_history.period_end.dt.year == 2016]
          y2016_dated = y2016.loc[y2016.report_date.notna()]

          print(f'Yahoo-historik tickers: {len(all_history)}')
          print(f'Tickers med minst en historisk score: {(valuation.score_rows > 0).sum()}/{len(valuation)}')
          print(f'Tickers med historiskt P/E: {(valuation.pe_rows > 0).sum()}/{len(valuation)}')
          print(f'Aktuellt Yahoo EPS hämtat: {comparison.yahoo_eps_ttm.notna().sum()}/{len(comparison)}')
          print(f'Strikt kompatibla Börsdata-tickers (<1% i VARJE överlapp): {compatibility.strict_compatible.astype(bool).sum()}/{len(compatibility)}')
          print(f'Kvarvarande referensluckor från första batchen: {len(reference_gaps)} varav {len(internal_reference)} interna')
          print(f'Interna Yahoo-periodluckor i hela universumet: {len(internal_period)}')
          print(f'Interna Yahoo-perioder utan säkert rapportdatum: {len(internal_date)}')
          print(f'Yahoo diluted TTM före 2022: {len(older)} perioder för {older.ticker.nunique()} tickers; med säkert rapportdatum {len(older_dated)} för {older_dated.ticker.nunique()} tickers')
          print(f'Yahoo diluted TTM under 2016: {len(y2016)} perioder för {y2016.ticker.nunique()} tickers; med säkert rapportdatum {len(y2016_dated)} för {y2016_dated.ticker.nunique()} tickers')
          if not older_dated.empty:
              print('Äldsta Yahoo-period per ticker som faktiskt kan användas eftersom rapportdatum finns:')
              print(older_dated.groupby('ticker').period_end.min().sort_values().head(30).to_string())
          if not internal_reference.empty:
              print('Kvarvarande interna referensluckor efter strikt <1%-gap-fill:')
              print(internal_reference[['ticker','report_period','report_date','previous_comparable_period','next_comparable_period','stale_window_days']].to_string(index=False))
          PY

      - name: Spara Yahoo-historik och audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nyhetsagentens events.json ska aldrig committas av EPS-flödet.
          git restore docs/data/events.json

          git add data/fundamentals/eps_ttm_history_enriched.csv
          git add data/fundamentals/eps_ttm_history_aligned.csv
          git add data/fundamentals/yahoo_history_all.csv
          git add data/fundamentals/reports.csv
          git add data/metadata/stocks_yahoo.csv
          git add data/derived/eps_report_date_audit.csv
          git add data/derived/eps_report_date_missing.csv
          git add data/derived/eps_report_date_overrides_applied.csv
          git add data/derived/yahoo_trailing_eps_timeseries_audit.csv
          git add data/derived/yahoo_history_all_audit.csv
          git add data/derived/eps_alignment_audit.csv
          git add data/derived/eps_reference_compatibility_audit.csv
          git add data/derived/eps_reference_gap_audit.csv
          git add data/derived/yahoo_history_continuity_audit.csv
          git add data/derived/historical_valuation_audit.csv
          git add data/derived/latest_eps_yahoo_comparison.csv
          git add docs/data/dashboard.json docs/data/stocks.json docs/data/earnings.json

          if [ -f data/fx/fx_initial.csv ]; then git add data/fx/fx_initial.csv; fi
          if [ -f data/fx/fx_updates.csv ]; then git add data/fx/fx_updates.csv; fi
          if [ -f data/earnings/earnings_initial.csv ]; then git add data/earnings/earnings_initial.csv; fi
          if [ -f data/earnings/earnings_updates.csv ]; then git add data/earnings/earnings_updates.csv; fi

          if git diff --cached --quiet; then
            echo "Inga ändringar att spara."
            exit 0
          fi

          git commit -m "data: test Yahoo EPS history back to 2016"
          git pull --rebase --autostash origin main
          git push origin main
