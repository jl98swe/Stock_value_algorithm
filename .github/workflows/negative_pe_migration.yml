name: Negative PE history migration
on:
  push:
    branches: [codex/negative-pe-diluted]
    paths:
      - "src/valuation.py"
      - "src/migrate_negative_pe_scores.py"
      - "data/model/negpe_gbm_model.json"
      - ".github/workflows/negative_pe_migration.yml"
permissions:
  contents: write
concurrency:
  group: stock-data-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test models and migration
        run: python -m pytest -q
      - name: Migrate negative EPS periods with report-known data
        run: python -m src.migrate_negative_pe_scores --workers 4
      - name: Rebuild signals and dashboard
        run: |
          python -m src.pipeline --skip-fetch --skip-dividends
          python -m src.limit_dashboard_window
          python -m src.validate_outputs
      - name: Save validated data on the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/valuation_score_history.csv.gz docs/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: migrate negative PE scores and rebuild dashboard"
          git push origin HEAD:"$GITHUB_REF_NAME"
