name: Verifierad LUMI-publicering och historikrättelse
on:
  push:
    branches: [main]
    paths:
      - data/fundamentals/report_publications.csv
      - .github/workflows/lumi_publication_correction.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: stock-data-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Testa verifierad publicering och skyddad historik
        run: |
          python -m pytest -q tests/test_report_publications.py tests/test_report_date_revisions.py tests/test_fundamentals.py tests/test_intraday_valuation.py
          node --test tests/test_eps_provenance_ui.cjs tests/test_reports_ui.cjs tests/test_event_strip.cjs
      - name: Korrigera datum och räkna om endast LUMI:s frysta poäng
        run: |
          git rev-parse HEAD > /tmp/lumi-base
          python -m src.lumi_publication_audit --apply
          python -m src.pipeline --skip-fetch --skip-dividends --recalculate-score-from LUMI.ST=2018-10-24
          python -m src.limit_dashboard_window
          python -m src.validate_outputs
          python -m src.lumi_publication_audit --base-ref "$(cat /tmp/lumi-base)"
          python -m src.history_guard --base-ref "$(cat /tmp/lumi-base)"
      - name: Publicera verifierad rättelse och granskningsunderlag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals/reports.csv data/fundamentals/eps_report_date_cache.csv data/derived/valuation_score_history.csv.gz data/derived/report_score_dates.csv data/derived/report_date_score_revisions.csv docs/data reference/lumi_publication_2026-11-05*
          if ! git diff --cached --quiet; then
            git commit -m "data: correct all verified LUMI publication sessions and rebuild history"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            python -m src.history_guard --base-ref "origin/$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
