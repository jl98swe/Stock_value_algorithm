name: Yahoo trailing EPS-timeseries

on:
  workflow_dispatch:
  push:
    paths:
      - "src/audit_yahoo_trailing_timeseries.py"
      - "src/quarterly_eps.py"
      - "src/build_yahoo_history_all.py"
      - "src/audit_yahoo_startpoints.py"
      - "src/align_historical_eps_to_yahoo.py"
      - ".github/workflows/audit_yahoo_trailing_timeseries.yml"

permissions:
  contents: write

concurrency:
  group: yahoo-trailing-eps-timeseries
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Hämta Yahoo trailing EPS-timeseries
        run: python -m src.audit_yahoo_trailing_timeseries

      - name: Backfilla kvartals-EPS för hela aktieuniversumet
        run: python -m src.quarterly_eps --backfill

      - name: Bygg Yahoo-historik med separata rapportdatum
        run: python -m src.build_yahoo_history_all

      - name: Hitta första användbara Yahoo-period per ticker
        run: python -m src.audit_yahoo_startpoints

      - name: Aligna historisk EPS till trailingDilutedEPS
        run: python -m src.align_historical_eps_to_yahoo

      - name: Spara audit, kvartals-EPS, startpunkter och alignad historik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/yahoo_trailing_eps_timeseries_audit.csv
          git add data/earnings/quarterly_eps.csv
          git add data/derived/quarterly_eps_coverage.csv
          git add data/derived/quarterly_eps_coverage_summary.json
          git add docs/data/quarterly_eps.json
          git add data/fundamentals/yahoo_history_all.csv
          git add data/derived/yahoo_history_all_audit.csv
          git add data/derived/yahoo_eps_startpoints.csv
          git add data/derived/yahoo_eps_startpoints_summary.csv
          git add data/metadata/stocks_yahoo.csv
          git add data/derived/eps_alignment_audit.csv
          git add data/fundamentals/eps_ttm_history_aligned.csv
          if git diff --cached --quiet; then
            echo "Inga ändringar att spara."
            exit 0
          fi
          git commit -m "data: update Yahoo quarterly EPS coverage"
          git pull --rebase --autostash origin main
          git push origin main
