name: Yahoo trailing EPS-timeseries

on:
  workflow_dispatch:
  push:
    paths:
      - "src/audit_yahoo_trailing_timeseries.py"
      - "src/align_historical_eps_to_yahoo.py"
      - ".github/workflows/audit_yahoo_trailing_timeseries.yml"

permissions:
  contents: write

concurrency:
  group: yahoo-trailing-eps-timeseries
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Hämta Yahoo trailing EPS-timeseries
        run: python -m src.audit_yahoo_trailing_timeseries

      - name: Aligna historisk EPS till trailingDilutedEPS
        run: python -m src.align_historical_eps_to_yahoo

      - name: Spara audit och alignad historik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/yahoo_trailing_eps_timeseries_audit.csv
          git add data/derived/eps_alignment_audit.csv
          git add data/fundamentals/eps_ttm_history_aligned.csv
          if git diff --cached --quiet; then
            echo "Inga ändringar att spara."
            exit 0
          fi
          git commit -m "data: align historical EPS to Yahoo diluted EPS"
          git pull --rebase --autostash origin main
          git push origin main
