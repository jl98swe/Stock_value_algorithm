name: Daglig bolagsnyhetsuppdatering

on:
  schedule:
    # Kör efter ordinarie marknadsuppdatering. Två UTC-tider täcker svensk
    # sommar-/vintertid; tidskontrollen nedan släpper bara igenom 18:05 Stockholm.
    - cron: "5 16 * * 1-5"
    - cron: "5 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-company-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kontrollera svensk klocktid
        id: news_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Stockholm date +'%H:%M')" = "18:05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Fel UTC-körning för aktuell svensk tidszon; inga nyheter uppdateras."
          fi

      - name: Checka ut repot
        if: steps.news_time.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        if: steps.news_time.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        if: steps.news_time.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Hämta och filtrera nya MFN-meddelanden
        if: steps.news_time.outputs.run == 'true'
        run: python -m src.news_curated

      - name: Spara nyhetsdata och publicerade N-händelser
        if: steps.news_time.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news docs/data/events.json
          if [ -d data/raw/news ]; then
            find data/raw/news -type f -name '*.json' -print0 | xargs -0 -r git add --
          fi

          if git diff --cached --quiet; then
            echo "Inga nyhetsändringar att spara."
            exit 0
          fi

          git commit -m "data: uppdatera bolagsnyheter"
          git pull --rebase origin main
          git push origin main