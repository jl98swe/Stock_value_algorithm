name: Daglig bolagsnyhetsuppdatering

on:
  schedule:
    # GitHub kan starta jobbet sent. Kontrollera inte aktuell klockminut.
    - cron: "5 18 * * 1-5"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-data-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Hämta och filtrera nya MFN-meddelanden
        run: python -m src.news_curated

      - name: Spara nyhetsdata och publicerade N-händelser
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news docs/data/events.json
          if [ -d data/raw/news ]; then
            find data/raw/news -type f -name '*.json' -print0 | xargs -0 -r git add --
          fi

          if git diff --cached --quiet; then
            echo "Inga nyhetsändringar att spara."
            exit 0
          fi

          git commit -m "data: uppdatera bolagsnyheter"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
