name: Yahoo historisk EPS-audit

on:
  workflow_dispatch:
  push:
    paths:
      - "src/audit_yahoo_historical_eps.py"
      - ".github/workflows/audit_yahoo_historical_eps.yml"

permissions:
  contents: write

concurrency:
  group: yahoo-historical-eps-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Uppdatera aktuell Yahoo EPS
        run: python -m src.earnings

      - name: Uppdatera FX
        run: python -m src.fx

      - name: Rekonstruera historisk Yahoo EPS TTM
        run: python -m src.audit_yahoo_historical_eps

      - name: Visa sammanfattning
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'data/derived/yahoo_reported_eps_ttm_audit.csv'
          df = pd.read_csv(p)
          print('Rader:', len(df))
          print('Yahoo TTM tillgänglig:', df.yahoo_ttm_report_currency.notna().sum())
          print('Användbara:', (df.status == 'usable').sum())
          print('Tickers användbara:', df.loc[df.status == 'usable', 'ticker'].nunique())
          print('\nSenaste rad per ticker:')
          cols = ['ticker','report_period','historical_eps_ttm','yahoo_ttm_report_currency','historical_vs_yahoo_error_pct','latest_roll4_vs_direct_error_pct','status']
          print(df.groupby('ticker', as_index=False).tail(1)[cols].to_string(index=False))
          PY

      - name: Spara audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/yahoo_reported_eps_ttm_audit.csv
          if [ -f data/earnings/earnings_updates.csv ]; then git add data/earnings/earnings_updates.csv; fi
          if [ -f data/fx/fx_updates.csv ]; then git add data/fx/fx_updates.csv; fi
          if git diff --cached --quiet; then
            echo "Inga ändringar att spara."
            exit 0
          fi
          git commit -m "data: audit Yahoo historical EPS consistency"
          git pull --rebase origin main
          git push origin main
