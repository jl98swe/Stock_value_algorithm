name: Lägg till EPS från rapport

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Yahoo-ticker, t.ex. ESSITY-B.ST"
        required: true
        type: string
      report_period:
        description: "Rapportperiod, t.ex. 2026-Q2"
        required: true
        type: string
      period_end:
        description: "Periodslut YYYY-MM-DD"
        required: true
        type: string
      published_at:
        description: "Publiceringstid med tidszon; EPS gäller automatiskt samma svenska dag"
        required: true
        type: string
      metric:
        description: "Vilket EPS-mått matar du in?"
        required: true
        default: "eps_ttm"
        type: choice
        options:
          - eps_ttm
          - quarterly_eps
      value:
        description: "EPS-värde i bolagets rapportvaluta"
        required: true
        type: string
      source:
        description: "Källa"
        required: true
        default: "Bolagets rapport"
        type: string
      notes:
        description: "Notering / audit trail"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: stock-data-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lägg in manuellt EPS-värde
        env:
          TICKER: ${{ inputs.ticker }}
          REPORT_PERIOD: ${{ inputs.report_period }}
          PERIOD_END: ${{ inputs.period_end }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          METRIC: ${{ inputs.metric }}
          VALUE: ${{ inputs.value }}
          SOURCE: ${{ inputs.source }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$METRIC" = "eps_ttm" ]; then
            EPS_ARGUMENT="--eps-ttm"
          elif [ "$METRIC" = "quarterly_eps" ]; then
            EPS_ARGUMENT="--eps"
          else
            echo "Okänt EPS-mått: $METRIC" >&2
            exit 1
          fi
          python -m src.add_report \
            --ticker "$TICKER" \
            --report-period "$REPORT_PERIOD" \
            --period-end "$PERIOD_END" \
            --published-at "$PUBLISHED_AT" \
            "$EPS_ARGUMENT" "$VALUE" \
            --source "$SOURCE" \
            --notes "$NOTES"

      - name: Bygg om dashboard med registrerad EPS
        run: python -m src.pipeline --skip-fetch --skip-dividends

      - name: Begränsa dashboard från 2019-09-02
        run: python -m src.limit_dashboard_window

      - name: Validera data och webbexport
        run: python -m src.validate_outputs

      - name: Spara verifierad EPS och webbdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals/reports.csv data/manual/report_submissions.csv docs/data
          git add data/derived/valuation_score_history.csv.gz
          git add data/earnings/quarterly_eps.csv
          if [ -f data/fx/fx_updates.csv ]; then
            git add data/fx/fx_updates.csv
          fi
          if [ -f data/earnings/earnings_initial.csv ]; then
            git add data/earnings/earnings_initial.csv
          fi
          if [ -f data/earnings/earnings_updates.csv ]; then
            git add data/earnings/earnings_updates.csv
          fi
          if git diff --cached --quiet; then
            echo "Inga ändringar att spara."
            exit 0
          fi
          git commit -m "fundamentals: manuellt EPS-värde ${{ inputs.ticker }} ${{ inputs.report_period }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
