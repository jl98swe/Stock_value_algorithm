name: Lägg till verifierad EPS TTM

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Yahoo-ticker, t.ex. ESSITY-B.ST"
        required: true
        type: string
      report_period:
        description: "Rapportperiod, t.ex. 2026-Q2"
        required: true
        type: string
      period_end:
        description: "Periodslut YYYY-MM-DD"
        required: true
        type: string
      published_at:
        description: "Publiceringstid med tidszon, t.ex. 2026-07-17T07:00:00+02:00"
        required: true
        type: string
      effective_date:
        description: "Första handelsdag då EPS får användas, YYYY-MM-DD"
        required: true
        type: string
      eps_ttm:
        description: "Verifierad EPS TTM"
        required: true
        type: string
      source:
        description: "Källa"
        required: true
        default: "Bolagets rapport"
        type: string
      notes:
        description: "Notering / audit trail"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: verified-eps-write
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lägg in verifierad EPS
        env:
          TICKER: ${{ inputs.ticker }}
          REPORT_PERIOD: ${{ inputs.report_period }}
          PERIOD_END: ${{ inputs.period_end }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          EFFECTIVE_DATE: ${{ inputs.effective_date }}
          EPS_TTM: ${{ inputs.eps_ttm }}
          SOURCE: ${{ inputs.source }}
          NOTES: ${{ inputs.notes }}
        run: |
          python -m src.add_report \
            --ticker "$TICKER" \
            --report-period "$REPORT_PERIOD" \
            --period-end "$PERIOD_END" \
            --published-at "$PUBLISHED_AT" \
            --effective-date "$EFFECTIVE_DATE" \
            --eps-ttm "$EPS_TTM" \
            --source "$SOURCE" \
            --notes "$NOTES"

      - name: Bygg om dashboard med verifierad EPS
        run: python -m src.pipeline --skip-fetch --skip-dividends

      - name: Validera data och webbexport
        run: python -m src.validate_outputs

      - name: Spara verifierad EPS och webbdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals/reports.csv docs/data
          if git diff --cached --quiet; then
            echo "Inga ändringar att spara."
            exit 0
          fi
          git commit -m "fundamentals: verifierad EPS ${{ inputs.ticker }} ${{ inputs.report_period }}"
          git pull --rebase origin main
          git push origin main
