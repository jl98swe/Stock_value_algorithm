name: Pipeline smoke test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "data/model/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Kör kärntester
        run: python -m pytest -q

      - name: Verifiera inbäddad GBM-modell
        run: python -m src.model_data

      - name: Bygg webbdata utan nätverkshämtning
        run: python -m src.pipeline --skip-fetch --skip-dividends

      - name: Begränsa dashboard från 2024-01-01
        run: python -m src.limit_dashboard_window

      - name: Validera data och webbexport
        run: python -m src.validate_outputs

      - name: Kontrollera grundläggande konsistens
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.fetch_data import load_price_history

          prices = load_price_history()
          dashboard = json.loads(Path("docs/data/dashboard.json").read_text(encoding="utf-8"))
          stocks = json.loads(Path("docs/data/stocks.json").read_text(encoding="utf-8"))
          events = json.loads(Path("docs/data/events.json").read_text(encoding="utf-8"))

          tickers = set(prices["ticker"].astype(str).unique())
          listed = {row["ticker"] for row in stocks["stocks"]}
          assert listed == tickers, (len(listed), len(tickers))
          assert set(dashboard["stocks"]) == tickers
          assert dashboard["meta"]["valuation_model"] == "ready"
          assert dashboard["meta"]["frontend_start_date"] == "2024-01-01"
          assert any(item.get("event_type") == "dividend" for item in events["events"])
          assert all(stock["candles"] for stock in dashboard["stocks"].values())
          assert all("ma200" in stock["candles"][-1] for stock in dashboard["stocks"].values())
          assert all(
              all(row["date"] >= "2024-01-01" for row in stock["candles"])
              for stock in dashboard["stocks"].values()
          )
          assert all(
              all(row["date"] >= "2024-01-01" for row in stock["scores"])
              for stock in dashboard["stocks"].values()
          )
          print(f"Smoke test OK: {len(tickers)} tickers, modell aktiv, dashboard från 2024-01-01.")
          PY
