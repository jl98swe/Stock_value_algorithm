name: Korrigera GENO rapportdatum

on:
  push:
    branches: [main]
    paths: [".github/workflows/correct_geno_report_date.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-data-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Korrigera kanonisk rapport och importunderlag
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from src.fundamentals import load_reports, save_reports
          from src.score_history import load_score_history
          
          reports = load_reports()
          reports.to_pickle("/tmp/geno_reports_before.pkl")
          load_score_history().to_pickle("/tmp/geno_scores_before.pkl")
          mask = reports.ticker.eq("GENO.ST") & reports.report_period.eq("2026-Q2")
          assert mask.sum() == 1
          assert reports.loc[mask, "period_end"].iloc[0] == pd.Timestamp("2026-06-30")
          assert abs(float(reports.loc[mask, "eps_ttm"].iloc[0]) - 0.3101) < 1e-12
          reports.loc[mask, "effective_date"] = pd.Timestamp("2026-07-23")
          reports.loc[mask, "notes"] = (
              reports.loc[mask, "notes"].astype(str)
              + "; report_date_verified_by_user=2026-07-23; date_correction=2026-10-06"
          )
          save_reports(reports)
          
          # Update each import source that could restore the old fallback date.
          for name in [
              "tradingview_eps_overrides.csv", "report_date_overrides.csv",
              "eps_report_date_cache.csv", "eps_ttm_history.csv",
              "eps_ttm_history_enriched.csv", "eps_ttm_history_aligned.csv",
          ]:
              path = Path("data/fundamentals") / name
              frame = pd.read_csv(path, encoding="utf-8-sig", dtype=str, keep_default_na=False)
              target = frame.ticker.isin(["GENO", "GENO.ST"]) & frame.report_period.eq("2026-Q2")
              if not target.any():
                  assert name not in {
                      "tradingview_eps_overrides.csv", "report_date_overrides.csv",
                      "eps_report_date_cache.csv"
                  }, f"Missing GENO Q2 row in {name}"
                  continue
              assert target.sum() == 1, name
              frame.loc[target, "report_date"] = "2026-07-23"
              if name == "report_date_overrides.csv":
                  frame.loc[target, "source"] = "Report date verified by user: 2026-07-23"
              if "report_date_status" in frame:
                  frame.loc[target, "report_date_status"] = "verified_by_user"
              frame.to_csv(path, index=False, encoding="utf-8-sig" if name == "tradingview_eps_overrides.csv" else "utf-8")
          PY
      - name: Räkna om GENO från verifierat rapportdatum
        run: python -m src.pipeline --skip-fetch --skip-dividends --recalculate-score-from GENO.ST=2026-07-23
      - run: python -m src.limit_dashboard_window
      - run: python -m pytest -q
      - run: python -m src.validate_outputs
      - name: Verifiera korrigeringen och skyddad historik
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from src.fundamentals import load_reports
          from src.score_history import load_score_history
          
          reports = load_reports()
          old_reports = pd.read_pickle("/tmp/geno_reports_before.pkl")
          target = reports.ticker.eq("GENO.ST") & reports.report_period.eq("2026-Q2")
          old_target = old_reports.ticker.eq("GENO.ST") & old_reports.report_period.eq("2026-Q2")
          pd.testing.assert_frame_equal(
              old_reports.loc[~old_target].reset_index(drop=True),
              reports.loc[~target].reset_index(drop=True),
          )
          row = reports.loc[target].iloc[0]
          assert row.effective_date == pd.Timestamp("2026-07-23")
          assert row.period_end == pd.Timestamp("2026-06-30")
          assert row.eps_ttm == 0.3101
          old = pd.read_pickle("/tmp/geno_scores_before.pkl")
          new = load_score_history()
          cutoff = pd.Timestamp("2026-07-23")
          def protected(frame):
              return frame.loc[~(frame.ticker.eq("GENO.ST") & frame.date.ge(cutoff))].reset_index(drop=True)
          pd.testing.assert_frame_equal(protected(old), protected(new))
          dashboard = json.loads(Path("docs/data/dashboard.json").read_text())
          split = json.loads(Path("docs/data/dashboard/GENO.ST.json").read_text())
          for stock in [dashboard["stocks"]["GENO.ST"], split]:
              assert stock["report"]["effective_date"] == "2026-07-23"
              assert stock["report"]["eps_ttm"] == 0.3101
          comparison = old.merge(new, on=["ticker", "date"], suffixes=("_old", "_new"))
          changed = comparison.loc[(comparison.score_old - comparison.score_new).abs().gt(1e-10)]
          assert changed.ticker.eq("GENO.ST").all()
          assert changed.date.ge(cutoff).all()
          print(f"GENO corrected: {len(changed)} scores changed; all other tickers and pre-report scores unchanged.")
          print(changed[["date", "score_old", "score_new"]].to_string(index=False))
          PY
      - name: Spara korrigering och webbdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals docs/data data/derived/valuation_score_history.csv.gz
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: GENO Q2 report date July 23 and affected valuation scores"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
