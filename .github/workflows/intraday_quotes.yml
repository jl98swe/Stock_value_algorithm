name: Intradagskurser · Nasdaq och Avanza

on:
  push:
    branches: [main]
    paths:
      - "src/intraday.py"
      - "src/intraday_schedule.py"
      - "src/intraday_valuation.py"
      - "src/signal_prices.py"
      - "config/intraday_instruments.json"
      - ".github/workflows/intraday_quotes.yml"
  schedule:
    - cron: "0 13,16 * * 1-5"
      timezone: "Europe/Stockholm"
    # The 09:00 opening is not visible in Nasdaq's delayed feed until later.
    - cron: "20 9 * * 1-5"
      timezone: "Europe/Stockholm"
    # Independent UTC wake-ups retry missed starts. Python checks Stockholm
    # time (including DST) and skips slots already present in the shared cache.
    - cron: "7,22,37,52 7-18 * * 1-5"
  workflow_dispatch:
  workflow_run:
    workflows: [Daglig marknadsuppdatering, Dagskurser 18.30 · Avanza]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: shared-intraday-cache
  cancel-in-progress: false
  queue: max

jobs:
  quotes:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Kontrollera om en hämtning saknas
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python -m src.intraday_schedule --scheduled
          else
            python -m src.intraday_schedule
          fi
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Installera kursinsamlingens beroenden
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install 'requests>=2.32' 'pandas>=2.2,<3' 'exchange-calendars>=4.11' 'pyarrow>=16.1' 'yfinance>=0.2.54'
      - name: Uppdatera den gemensamma tillfälliga cachen
        if: steps.gate.outputs.run == 'true' && github.event_name != 'workflow_run'
        run: python -m src.intraday --publish
      - name: Rensa aktier med publicerad stängningskurs
        if: steps.gate.outputs.run == 'true' && github.event_name == 'workflow_run'
        run: python -m src.intraday --cleanup --publish
