name: Intradagskurser · Nasdaq och Avanza

on:
  push:
    branches: [main]
    paths:
      - "src/intraday.py"
      - "config/intraday_instruments.json"
      - ".github/workflows/intraday_quotes.yml"
  schedule:
    - cron: "0 9,13,17 * * 1-5"
      timezone: "Europe/Stockholm"
    - cron: "30 17 * * 1-5"
      timezone: "Europe/Stockholm"
    # Nasdaq's 09:00 opening and 17:30 auction are not visible until later.
    - cron: "20 9 * * 1-5"
      timezone: "Europe/Stockholm"
    - cron: "50 17 * * 1-5"
      timezone: "Europe/Stockholm"
    - cron: "30 18 * * 1-5"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
  workflow_run:
    workflows: [Daglig marknadsuppdatering]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: shared-intraday-cache
  cancel-in-progress: false
  queue: max

jobs:
  quotes:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installera kursinsamlingens beroenden
        run: python -m pip install 'requests>=2.32' 'pandas>=2.2,<3' 'exchange-calendars>=4.11'
      - name: Uppdatera den gemensamma tillfälliga cachen
        if: github.event_name != 'workflow_run'
        run: python -m src.intraday --publish
      - name: Rensa aktier med publicerad stängningskurs
        if: github.event_name == 'workflow_run'
        run: python -m src.intraday --cleanup --publish
