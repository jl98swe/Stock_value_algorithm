name: Full integration test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-stock-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Hämta valutakurser
        run: python -m src.fx

      - name: Kör marknadspipelinen mot Yahoo
        run: python -m src.pipeline --defer-score-history

      - name: Hämta Yahoo trailingDilutedEPS
        run: python -m src.earnings

      - name: Synka ny Yahoo EPS till reports.csv
        run: python -m src.sync_yahoo_eps_reports

      - name: Bygg om dashboard med dagens EPS
        run: python -m src.pipeline --skip-fetch --skip-dividends

      - name: Begränsa dashboard från 2024-01-01
        run: python -m src.limit_dashboard_window

      - name: Validera resultatet
        run: python -m src.validate_outputs

      - name: Spara verifierad integrationsdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/earnings/earnings_initial.csv data/fx/fx_initial.csv data/fundamentals/reports.csv data/derived/valuation_score_history.csv.gz
          if [ -f data/prices/price_updates.csv ]; then
            git add data/prices/price_updates.csv
          fi
          if [ -f data/dividends/dividend_updates.csv ]; then
            git add data/dividends/dividend_updates.csv
          fi
          if [ -f data/fx/fx_updates.csv ]; then
            git add data/fx/fx_updates.csv
          fi
          if [ -f data/earnings/earnings_updates.csv ]; then
            git add data/earnings/earnings_updates.csv
          fi
          if git diff --cached --quiet; then
            echo "Integrationen är grön och inga data behöver committas."
            exit 0
          fi
          git commit -m "data: verifierad Yahoo diluted EPS integration"
          git pull --rebase --autostash origin main
          git push origin main
