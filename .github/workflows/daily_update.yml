name: Daglig uppdatering och GitHub Pages

on:
  schedule:
    - cron: "45 17 * * 1-5"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
    inputs:
      force_full_price_fetch:
        description: "Hämta hela den konfigurerade prisperioden på nytt"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-value-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Kör tester
        run: python -m pytest

      - name: Hämta om hela prisserien vid manuell begäran
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_price_fetch }}
        run: python -m src.fetch_data --full

      - name: Bygg dagens data och webbplats
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_full_price_fetch }}" = "true" ]; then
            python -m src.pipeline --skip-fetch
          else
            python -m src.pipeline
          fi

      - name: Spara genererade data i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Inga dataändringar att spara."
          else
            git commit -m "data: daglig uppdatering"
            git push
          fi

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp Pages-artefakt
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
