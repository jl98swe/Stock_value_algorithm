name: Daglig marknadsuppdatering

on:
  schedule:
    # GitHub cron använder UTC. Två tider täcker svensk sommar-/vintertid;
    # steget nedan låter bara körningen som faktiskt är 17:45 Stockholm fortsätta.
    - cron: "45 15 * * 1-5"
    - cron: "45 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera svensk klocktid
        id: market_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Stockholm date +'%H:%M')" = "17:45" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Fel UTC-körning för aktuell svensk tidszon; ingen data uppdateras."
          fi

      - name: Checka ut repot
        if: steps.market_time.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        if: steps.market_time.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        if: steps.market_time.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Uppdatera priser, utdelningar och bygg GitHub Pages-data
        if: steps.market_time.outputs.run == 'true'
        run: python -m src.pipeline

      - name: Uppdatera direkt EPS TTM
        if: steps.market_time.outputs.run == 'true'
        run: python -m src.earnings

      - name: Validera data och webbexport
        if: steps.market_time.outputs.run == 'true'
        run: python -m src.validate_outputs

      - name: Spara dagens data
        if: steps.market_time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data

          if [ -f data/prices/price_updates.csv ]; then
            git add data/prices/price_updates.csv
          else
            echo "Ingen price_updates.csv skapades denna körning."
          fi

          if [ -f data/dividends/dividend_updates.csv ]; then
            git add data/dividends/dividend_updates.csv
          else
            echo "Ingen dividend_updates.csv skapades denna körning."
          fi

          if [ -f data/earnings/earnings_initial.csv ]; then
            git add data/earnings/earnings_initial.csv
          fi

          if [ -f data/earnings/earnings_updates.csv ]; then
            git add data/earnings/earnings_updates.csv
          else
            echo "Ingen earnings_updates.csv skapades denna körning."
          fi

          if git diff --cached --quiet; then
            echo "Inga dataändringar att spara."
            exit 0
          fi

          git commit -m "data: daglig marknadsuppdatering"
          git pull --rebase origin main
          git push origin main
