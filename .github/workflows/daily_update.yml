name: Daglig marknadsuppdatering

on:
  schedule:
    - cron: "45 17 * * 1-5"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_update.yml"

permissions:
  contents: write

concurrency:
  group: daily-stock-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Uppdatera valutakurser
        run: python -m src.fx

      - name: Uppdatera priser och utdelningar
        run: python -m src.pipeline

      - name: Uppdatera Yahoo trailingDilutedEPS
        run: python -m src.earnings

      - name: Synka ny Yahoo EPS till kanoniska rapporter
        run: python -m src.sync_yahoo_eps_reports

      - name: Bygg om dashboard med dagens EPS
        run: python -m src.pipeline --skip-fetch --skip-dividends

      - name: Begränsa dashboard från 2024-01-01
        run: python -m src.limit_dashboard_window

      - name: Validera data och webbexport
        run: python -m src.validate_outputs

      - name: Spara dagens data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data
          git add data/fundamentals/reports.csv

          if [ -f data/prices/price_updates.csv ]; then
            git add data/prices/price_updates.csv
          else
            echo "Ingen price_updates.csv skapades denna körning."
          fi

          if [ -f data/dividends/dividend_updates.csv ]; then
            git add data/dividends/dividend_updates.csv
          else
            echo "Ingen dividend_updates.csv skapades denna körning."
          fi

          if [ -f data/fx/fx_initial.csv ]; then
            git add data/fx/fx_initial.csv
          fi

          if [ -f data/fx/fx_updates.csv ]; then
            git add data/fx/fx_updates.csv
          else
            echo "Ingen fx_updates.csv skapades denna körning."
          fi

          if [ -f data/earnings/earnings_initial.csv ]; then
            git add data/earnings/earnings_initial.csv
          fi

          if [ -f data/earnings/earnings_updates.csv ]; then
            git add data/earnings/earnings_updates.csv
          else
            echo "Ingen earnings_updates.csv skapades denna körning."
          fi

          if git diff --cached --quiet; then
            echo "Inga dataändringar att spara."
            exit 0
          fi

          git commit -m "data: daglig marknadsuppdatering"
          git pull --rebase --autostash origin main
          git push origin main
