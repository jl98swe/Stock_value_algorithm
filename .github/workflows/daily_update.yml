name: Daglig marknadsuppdatering

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_update.yml"
      - "src/pipeline.py"
      - "src/events.py"
      - "src/score_history.py"
      - "src/fetch_data.py"
      - "src/validate_outputs.py"
  schedule:
    - cron: "30 17 * * 1-5"
      timezone: "Europe/Stockholm"
    # Only collects on early-close sessions; full days return not_due.
    - cron: "15 13 * * 1-5"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [Yahoo, Avanza]
        default: Yahoo
  workflow_call:
    inputs:
      source:
        type: string
        default: Yahoo
      planned:
        type: string
        default: "17:30"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.prices.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installera insamlingens beroenden
        run: python -m pip install 'requests>=2.32' 'pandas>=2.2,<3' 'exchange-calendars>=4.11' 'pyarrow>=16.1' 'yfinance>=0.2.54'
      - name: Hämta dagsdata utan publiceringslås
        id: prices
        env:
          PRICE_SOURCE: ${{ inputs.source || 'Yahoo' }}
          PLANNED_TIME: ${{ inputs.planned || (github.event.schedule == '15 13 * * 1-5' && '13:15') || '17:30' }}
        run: python -m src.closing_prices collect --source "$PRICE_SOURCE" --planned "$PLANNED_TIME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closing-snapshot-${{ inputs.source || 'Yahoo' }}-${{ github.run_id }}
          path: .cache/closing_snapshot.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  update:
    needs: collect
    if: needs.collect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: stock-data-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: closing-snapshot-${{ inputs.source || 'Yahoo' }}-${{ github.run_id }}
          path: .cache

      - name: Installera Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Uppdatera valutakurser
        run: python -m src.fx

      - name: Slå ihop med senast publicerade dagsdata
        run: python -m src.closing_prices apply

      - name: Uppdatera poäng och utdelningar utan ny kurshämtning
        run: python -m src.closing_prices build --defer-score-history

      - name: Uppdatera Yahoo trailingDilutedEPS
        run: python -m src.earnings --due-reports-only

      - name: Uppdatera Yahoo quarterlyDilutedEPS
        run: python -m src.quarterly_eps --due-reports-only

      - name: Fyll stale diluted EPS-luckor från Yahoo resultaträkningar
        run: python -m src.backfill_quarterly_eps_statement --due-reports-only

      - name: Synka ny Yahoo EPS till kanoniska rapporter
        run: python -m src.sync_yahoo_eps_reports

      - name: Efterkontrollera rapportdatum efter 7 och 14 dagar
        run: python -m src.recheck_report_dates

      - name: Bygg om dashboard med dagens EPS
        run: python -m src.closing_prices build

      - name: Begränsa dashboard från 2019-09-02
        run: python -m src.limit_dashboard_window

      - name: Validera data och webbexport
        run: python -m src.validate_outputs

      - name: Flagga saknade rapportdata
        run: python -m src.report_data_status

      - name: Spara dagens data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data
          git add data/prices/closing_sources.csv data/prices/closing_audit
          git add data/fundamentals/reports.csv
          git add data/derived/valuation_score_history.csv.gz
          git add data/derived/report_score_dates.csv
          if [ -f data/derived/report_date_score_revisions.csv ]; then
            git add data/derived/report_date_score_revisions.csv
          fi
          git add data/earnings/report_date_check_state.json data/earnings/report_date_status.json
          git add data/fundamentals/report_date_rechecks.csv
          if [ -f data/derived/report_date_checks.csv ]; then
            git add data/derived/report_date_checks.csv
          fi

          if [ -f data/earnings/report_calendar.csv ]; then
            git add data/earnings/report_calendar.csv
          fi

          if [ -f data/earnings/report_calendar_history.csv ]; then
            git add data/earnings/report_calendar_history.csv
          fi

          if [ -f data/prices/price_updates.csv ]; then
            git add data/prices/price_updates.csv
          else
            echo "Ingen price_updates.csv skapades denna körning."
          fi

          if [ -f data/dividends/dividend_updates.csv ]; then
            git add data/dividends/dividend_updates.csv
          else
            echo "Ingen dividend_updates.csv skapades denna körning."
          fi

          if [ -f data/fx/fx_initial.csv ]; then
            git add data/fx/fx_initial.csv
          fi

          if [ -f data/fx/fx_updates.csv ]; then
            git add data/fx/fx_updates.csv
          else
            echo "Ingen fx_updates.csv skapades denna körning."
          fi

          if [ -f data/earnings/earnings_initial.csv ]; then
            git add data/earnings/earnings_initial.csv
          fi

          if [ -f data/earnings/earnings_updates.csv ]; then
            git add data/earnings/earnings_updates.csv
          else
            echo "Ingen earnings_updates.csv skapades denna körning."
          fi

          if [ -f data/earnings/quarterly_eps.csv ]; then
            git add data/earnings/quarterly_eps.csv
          else
            echo "Ingen quarterly_eps.csv skapades denna körning."
          fi

          if git diff --cached --quiet; then
            echo "Inga dataändringar att spara."
            exit 0
          fi

          git commit -m "data: daglig marknadsuppdatering"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
