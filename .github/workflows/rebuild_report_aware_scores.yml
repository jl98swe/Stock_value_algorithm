name: Rebuild report-aware score history

on:
  push:
    branches: [fix/report-aware-score-history]
    paths:
      - "src/rebuild_report_aware_score_history.py"
      - "tests/test_rebuild_report_aware_score_history.py"
      - ".github/workflows/rebuild_report_aware_scores.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/report-aware-score-history

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild score history and web data
        run: |
          python -m src.rebuild_report_aware_score_history
          python -m src.pipeline --skip-fetch --skip-dividends
          python -m src.limit_dashboard_window

      - name: Test and validate
        run: |
          python -m pytest -q
          python -m src.validate_outputs

      - name: Commit rebuilt data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/valuation_score_history.csv.gz docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: rebuild report-aware valuation history"
          git push origin HEAD:fix/report-aware-score-history
